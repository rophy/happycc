# Local corporate deployment: oidc-mock (IdP) + Postgres + happy-server (+ web app).
# The server shares oidc-mock's network namespace so that "localhost:8180" is the
# same issuer URL for the server and for the browser on the host.
#
#   docker compose up -d oidc-mock                   # IdP only (for integration tests)
#   docker compose up -d --build                     # server stack; open http://localhost:3005/activate
#   docker compose --profile e2e up -d --build       # + web app on http://localhost:8080 (Playwright e2e)
#
# The cli service is a simulated client device running the happyco CLI:
#   docker compose exec cli happyco auth login       # open the printed link, sign in, Approve
#   docker compose exec -it cli happyco              # start a session; it shows up in the web app
# Claude Code on the device talks to aimock, which answers every prompt with a
# canned reply (deploy/aimock/fixtures.json): no real model, no API key.
#
# Users (no password, pick in the UI): alice, bob.
# AUTH_REFRESH_REUSE_GRACE=0s in the shell disables the server's lost-response
# retry window, so the e2e suite can prove that tabs never replay a refresh token.
# AUTH_ACCESS_TOKEN_TTL=3m in the shell shortens access tokens so the e2e suite can
# watch the server cut the sync socket at expiry and the app reconnect.
services:
  oidc-mock:
    image: ghcr.io/rophy/oidc-mock:20260913-34fdbaf
    command: ["serve"]
    environment:
      OIDC_CONFIG_FILE: /config.yaml
    volumes:
      - ./deploy/oidc-mock/config.yaml:/config.yaml:ro
    ports:
      - "8180:8180"   # oidc-mock
      - "3005:3005"   # happy-server (shares this network namespace)

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: happy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    network_mode: "service:oidc-mock"
    depends_on:
      oidc-mock: { condition: service_started }
      postgres: { condition: service_healthy }
    environment:
      PORT: "3005"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/happy
      HANDY_MASTER_SECRET: local-dev-master-secret-change-me-0000000000
      PUBLIC_URL: http://localhost:3005
      WEBAPP_URL: http://localhost:8080
      OIDC_ISSUER: http://localhost:8180
      OIDC_CLIENT_ID: happy-server
      OIDC_CLIENT_SECRET: happy-dev-secret
      OIDC_ALLOW_INSECURE_ISSUER: "true"
      MOBILE_REDIRECT_URIS: happy-dev://auth/callback,happy-preview://auth/callback
      AUTH_REFRESH_REUSE_GRACE: ${AUTH_REFRESH_REUSE_GRACE:-60s}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm run start"]

  webapp:
    profiles: [e2e]
    build:
      context: .
      dockerfile: Dockerfile.webapp
      args:
        # serverUrl is http://localhost:3005 as seen by the browser on the host
        # (oidc-mock publishes the server's port); bundleId/scheme are
        # placeholders the production config requires but the web ignores.
        APP_CONFIG: deploy/app-config/e2e.json
    depends_on:
      server: { condition: service_started }
    ports:
      - "8080:80"     # must match the server's WEBAPP_URL

  aimock:
    image: ghcr.io/copilotkit/aimock:1.43.0
    command: ["--fixtures", "/fixtures", "--host", "0.0.0.0"]
    volumes:
      - ./deploy/aimock:/fixtures:ro

  cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    # Same network namespace as the server, so localhost:3005 is the same URL
    # here and in the browser on the host.
    network_mode: "service:oidc-mock"
    depends_on:
      server: { condition: service_started }
      aimock: { condition: service_started }
    # Fixed on purpose: host shell values (server URL, a real API key) must not leak in.
    environment:
      HAPPY_SERVER_URL: http://localhost:3005
      HAPPY_WEBAPP_URL: http://localhost:8080
      ANTHROPIC_BASE_URL: http://aimock:4010
      ANTHROPIC_API_KEY: aimock
    volumes:
      - cli-happyco:/home/node/.happyco
      - cli-claude:/home/node/.claude
      - cli-workspace:/workspace

volumes:
  pgdata:
  cli-happyco:
  cli-claude:
  cli-workspace:
