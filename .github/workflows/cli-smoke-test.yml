name: CLI Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-wire/**'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-wire/**'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: |
        pnpm --filter @slopus/happy-wire --fail-if-no-match build
        pnpm --filter @happycc/cli --fail-if-no-match build

    - name: Pack packages
      run: |
        pnpm --filter @slopus/happy-wire --fail-if-no-match pack --pack-destination packages/happy-wire
        pnpm --filter @happycc/cli --fail-if-no-match pack --pack-destination packages/happy-cli

    - name: Install packed packages globally
      run: |
        WIRE_PACKAGE_FILE=$(ls packages/happy-wire/*.tgz)
        HAPPY_PACKAGE_FILE=$(ls packages/happy-cli/*.tgz)
        npm install -g "./$WIRE_PACKAGE_FILE" "./$HAPPY_PACKAGE_FILE"

    - name: Test binary execution
      run: |
        # Test that the binary starts successfully
        echo "Testing happycc --help..."
        timeout 30s happycc --help || {
          echo "Error: happycc --help failed or timed out"
          exit 1
        }

        echo "Testing happycc --version..."
        timeout 10s happycc --version || {
          echo "Error: happycc --version failed or timed out"
          exit 1
        }

        echo "Testing happycc doctor..."
        timeout 30s happycc doctor || {
          echo "Error: happycc doctor failed or timed out"
          exit 1
        }

        echo "Binary smoke test passed on Linux!"

  smoke-test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: |
        pnpm --filter @slopus/happy-wire --fail-if-no-match build
        pnpm --filter @happycc/cli --fail-if-no-match build

    - name: Pack packages
      run: |
        pnpm --filter @slopus/happy-wire --fail-if-no-match pack --pack-destination packages/happy-wire
        pnpm --filter @happycc/cli --fail-if-no-match pack --pack-destination packages/happy-cli

    - name: Install packed package globally
      shell: cmd
      run: |
        for %%w in (packages\happy-wire\*.tgz) do for %%f in (packages\happy-cli\*.tgz) do npm install -g "%%w" "%%f"

    - name: Debug npm global installation structure
      shell: cmd
      run: |
        for /f "tokens=*" %%i in ('npm config get prefix') do set NPM_PREFIX=%%i
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Listing npm prefix directory:
        dir "%NPM_PREFIX%" 2>nul || echo Failed to list NPM_PREFIX
        echo.
        echo Checking for node_modules in npm prefix:
        if exist "%NPM_PREFIX%\node_modules" (
          echo Found node_modules directory
          dir "%NPM_PREFIX%\node_modules" 2>nul
          echo.
          echo Checking for happycc package:
          if exist "%NPM_PREFIX%\node_modules\happycc" (
            echo Found happycc package
            dir "%NPM_PREFIX%\node_modules\happycc" 2>nul
            echo.
            echo Checking for dist directory:
            if exist "%NPM_PREFIX%\node_modules\happycc\dist" (
              echo Found dist directory
              dir "%NPM_PREFIX%\node_modules\happycc\dist" 2>nul
            ) else (
              echo No dist directory found
            )
          ) else (
            echo No happycc package found
          )
        ) else (
          echo No node_modules directory found
        )

    - name: Test binary execution
      shell: cmd
      run: |
        @echo on

        rem Get npm global prefix and add to PATH
        for /f "tokens=*" %%i in ('npm config get prefix') do set NPM_PREFIX=%%i
        set PATH=%NPM_PREFIX%;%PATH%
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Current PATH: %PATH%

        rem Debug: Check if happycc exists in various locations
        echo Checking for happycc binary...
        where happycc 2>nul && echo Found happycc in PATH || echo happycc not found in PATH
        if exist "%NPM_PREFIX%\happycc.cmd" echo Found happycc.cmd in NPM_PREFIX
        if exist "%NPM_PREFIX%\node_modules\.bin\happycc.cmd" echo Found happycc.cmd in .bin directory
        dir "%NPM_PREFIX%\*happycc*" 2>nul || echo No happycc files found in NPM_PREFIX

        rem Debug: Check the actual contents and encoding of the installed file
        if exist "%NPM_PREFIX%\happycc.cmd" (
          echo File size and type:
          dir "%NPM_PREFIX%\happycc.cmd"
          echo.
          echo First few lines of the file:
          type "%NPM_PREFIX%\happycc.cmd" | head -5
          echo.
          echo Hex dump of first 50 bytes to check line endings:
          powershell -Command "Get-Content '%NPM_PREFIX%\happycc.cmd' -Encoding Byte -TotalCount 50 | ForEach-Object { '{0:X2}' -f $_ } | Join-String -Separator ' '"
          echo.
          echo Testing with direct path...
          "%NPM_PREFIX%\happycc.cmd" --help
        ) else (
          echo Testing happycc --help...
          happycc --help
        )
        if errorlevel 1 (
          echo Error: happycc --help failed
          exit /b 1
        )

        rem Test version
        if exist "%NPM_PREFIX%\happycc.cmd" (
          "%NPM_PREFIX%\happycc.cmd" --version
        ) else (
          happycc --version
        )
        if errorlevel 1 (
          echo Error: happycc --version failed
          exit /b 1
        )

        rem Test doctor
        echo Testing happycc doctor...
        if exist "%NPM_PREFIX%\happycc.cmd" (
          "%NPM_PREFIX%\happycc.cmd" doctor
        ) else (
          happycc doctor
        )
        if errorlevel 1 (
          echo Error: happycc doctor failed
          exit /b 1
        )

        echo Smoke test passed on Windows!

# We don't need a smoke test for macOS because most contributors are developing on macOS.
