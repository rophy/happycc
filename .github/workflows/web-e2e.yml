name: Web E2E

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/happy-app/**'
      - 'packages/happy-server/**'
      - 'packages/happy-wire/**'
      - 'e2e/**'
      - 'Dockerfile.webapp'
      - 'Dockerfile.server'
      - 'docker-compose.yaml'
      - 'deploy/oidc-mock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/web-e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/happy-app/**'
      - 'packages/happy-server/**'
      - 'packages/happy-wire/**'
      - 'e2e/**'
      - 'Dockerfile.webapp'
      - 'Dockerfile.server'
      - 'docker-compose.yaml'
      - 'deploy/oidc-mock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # No lost-response grace on the compose server: a refresh-token replay between
    # tabs revokes the device, so the two-tab test proves the refresh lock works.
    env:
      AUTH_REFRESH_REUSE_GRACE: 0s

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: e2e/package-lock.json

    - name: Start stack
      run: docker compose --profile e2e up -d --build

    - name: Wait for services
      run: |
        for url in http://localhost:8180/.well-known/openid-configuration http://localhost:3005/health http://localhost:8080/; do
          ok=0
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null "$url"; then ok=1; echo "up: $url"; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "Error: $url did not come up"
            docker compose --profile e2e ps
            docker compose --profile e2e logs
            exit 1
          fi
        done

    - name: Install e2e dependencies
      working-directory: e2e
      run: npm ci

    - name: Install Chromium
      working-directory: e2e
      run: npx playwright install --with-deps chromium

    - name: Playwright
      working-directory: e2e
      run: npx playwright test

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          e2e/playwright-report
          e2e/test-results
        retention-days: 7

    - name: Stack logs on failure
      if: failure()
      run: docker compose --profile e2e logs

    - name: Stop stack
      if: always()
      run: docker compose --profile e2e down -v || true
