name: Release @happycc/agent

# Releases the version in packages/happy-agent/package.json when it changes on main: a version bump is
# a normal commit, and this workflow writes nothing to the repository but the release tag. The
# package is staged on npm (npm stage publish); a maintainer approves it with 2FA before it goes live.
# Mirrors release-happy-cli.yml.
on:
  push:
    branches: [main]
    paths:
      - 'packages/happy-agent/**'
      - 'packages/happy-wire/**'
      - 'scripts/agent-release*.cjs'
      - 'scripts/cli-release.cjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release-happy-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-happy-agent
  cancel-in-progress: false

env:
  PACKAGE: '@happycc/agent'
  PACKAGE_DIR: packages/happy-agent
  RELEASE_SCRIPT: scripts/agent-release.cjs

jobs:
  check:
    name: Decide whether to release
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compare the version with the tags and npm
        id: check
        run: |
          if [[ "$GITHUB_REPOSITORY" != 'rophy/happycc' || "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Releases run only on rophy/happycc main.' >&2
            exit 1
          fi
          version="$(node -p "require('./$PACKAGE_DIR/package.json').version")"
          tag="$(RELEASE_VERSION="$version" node -p "require('./$RELEASE_SCRIPT').releaseInput(process.env.RELEASE_VERSION).tag")"
          # The tag is pushed when a version is staged: a staged version is not visible on npm yet.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null \
            || npm view "$PACKAGE@$version" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE@$version is already released or staged; nothing to do."
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(npm view "$PACKAGE" dist-tags.latest --registry https://registry.npmjs.org/ 2>/dev/null || true)"
          RELEASE_VERSION="$version" RELEASE_LATEST="$latest" node "$RELEASE_SCRIPT" validate
          echo 'release=true' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Test, build and pack
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the release scripts
        run: node --test scripts/cli-release.test.cjs scripts/agent-release.test.cjs
      - name: Build wire, then type check, build and test the package
        run: |
          pnpm --filter @slopus/happy-wire --fail-if-no-match build
          pnpm --filter "$PACKAGE" --fail-if-no-match run prepublishOnly
      - name: Pack and check the exact npm artifact
        run: |
          mkdir -p release-assets "$RUNNER_TEMP/unpacked"
          pnpm --filter "$PACKAGE" --fail-if-no-match pack --pack-destination "$GITHUB_WORKSPACE/release-assets"
          tarball="$(node -p "require('./$RELEASE_SCRIPT').releaseInput(process.env.RELEASE_VERSION).tarball")"
          (cd release-assets && shasum -a 256 "$tarball" > "$tarball.sha256")
          tar -xzf "release-assets/$tarball" -C "$RUNNER_TEMP/unpacked"
          node "$RELEASE_SCRIPT" check-package "$RUNNER_TEMP/unpacked/package"
      - name: Smoke test the packed package outside the monorepo
        run: |
          smoke_root="$(mktemp -d "$RUNNER_TEMP/smoke.XXXXXX")"
          npm install --prefix "$smoke_root" "$GITHUB_WORKSPACE"/release-assets/*.tgz --no-audit --no-fund
          node "$RELEASE_SCRIPT" smoke "$smoke_root"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  stage:
    name: Stage on npm and tag
    needs: [check, build]
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: release-assets
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install an npm with staged publishing
        run: |
          npm install --global npm@12.2.0
          test "$(npm --version)" = '12.2.0'
      - name: Stage the tested artifact
        run: |
          read -r tarball channel tag < <(node -p "const r = require('./$RELEASE_SCRIPT').releaseInput(process.env.RELEASE_VERSION); [r.tarball, r.channel, r.tag].join(' ')")
          (cd release-assets && shasum -a 256 -c "$tarball.sha256")
          npm stage publish "$GITHUB_WORKSPACE/release-assets/$tarball" \
            --access public --tag "$channel" --provenance --registry https://registry.npmjs.org/
          integrity="sha512-$(openssl dgst -sha512 -binary "release-assets/$tarball" | openssl base64 -A)"
          {
            echo "Staged \`$PACKAGE@$RELEASE_VERSION\` for npm tag \`$channel\`. It is not installable until approved."
            echo
            echo "Before approving, check that the staged package has this integrity:"
            echo
            echo "\`$integrity\`"
            echo
            echo "Approve on npmjs.com, or with \`npm stage list $PACKAGE\` and \`npm stage approve <stage-id>\` (2FA)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Tag the released commit
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
