name: Server

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/happy-server/**'
      - 'packages/happy-server-self-host/**'
      - 'packages/happy-wire/**'
      - 'Dockerfile'
      - 'Dockerfile.server'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/server.yml'
      - 'deploy/oidc-mock/**'
      - 'docker-compose.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/happy-server/**'
      - 'packages/happy-server-self-host/**'
      - 'packages/happy-wire/**'
      - 'Dockerfile'
      - 'Dockerfile.server'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/server.yml'
      - 'deploy/oidc-mock/**'
      - 'docker-compose.yaml'
  workflow_dispatch:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build happy-wire
      run: pnpm --filter @slopus/happy-wire --fail-if-no-match build

    # `build` is the production typecheck (tsconfig.build.json, specs excluded).
    # This is exactly what Dockerfile.server runs, so a break here is a break there.
    - name: Production typecheck
      run: pnpm --filter happy-server --fail-if-no-match build

    # The full typecheck additionally covers specs, which reach into happy-app
    # for cross-package contract checks.
    - name: Full typecheck
      run: pnpm --filter happy-server --fail-if-no-match typecheck

    - name: Unit tests
      run: pnpm --filter happy-server --fail-if-no-match test

  oidc-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build wire package
      run: pnpm --filter @slopus/happy-wire --fail-if-no-match build

    - name: Start oidc-mock
      run: |
        docker compose up -d oidc-mock
        for i in $(seq 1 30); do
          curl -sf http://localhost:8180/.well-known/openid-configuration >/dev/null && exit 0
          sleep 1
        done
        docker compose logs oidc-mock
        exit 1

    - name: OIDC integration tests
      run: pnpm --filter happy-server --fail-if-no-match test:integration

    - name: oidc-mock logs on failure
      if: failure()
      run: docker compose logs oidc-mock

  # Builds the production image and proves it actually serves traffic.
  # A container whose CMD silently no-ops exits 0 immediately and would pass
  # every check except starting it, which is how a broken image shipped before.
  docker-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # The server needs an IdP at startup. oidc-mock publishes 8180 (and 3005 for
    # the compose server), so the server runs on the host network on 3006 and
    # sees the issuer at the same http://localhost:8180 URL.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/handy
      HANDY_MASTER_SECRET: ci-master-secret-not-used-in-production
      PORT: "3006"
      OIDC_ISSUER: http://localhost:8180
      OIDC_CLIENT_ID: happy-server
      OIDC_CLIENT_SECRET: happy-dev-secret
      OIDC_ALLOW_INSECURE_ISSUER: "true"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build production image
      run: docker build -t happy-server:ci -f Dockerfile.server .

    - name: Start oidc-mock
      run: |
        docker compose up -d oidc-mock
        for i in $(seq 1 30); do
          curl -sf http://localhost:8180/.well-known/openid-configuration >/dev/null && exit 0
          sleep 1
        done
        docker compose logs oidc-mock
        exit 1

    - name: Apply migrations
      run: |
        docker run --rm --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -w /repo/packages/happy-server \
          --entrypoint sh happy-server:ci \
          -c '../../node_modules/.bin/prisma migrate deploy'

    - name: Start container
      run: |
        docker run -d --name happy-server-ci --network host \
          -e DATABASE_URL="$DATABASE_URL" \
          -e HANDY_MASTER_SECRET="$HANDY_MASTER_SECRET" \
          -e PORT="$PORT" \
          -e METRICS_ENABLED=false \
          -e OIDC_ISSUER="$OIDC_ISSUER" \
          -e OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
          -e OIDC_CLIENT_SECRET="$OIDC_CLIENT_SECRET" \
          -e OIDC_ALLOW_INSECURE_ISSUER="$OIDC_ALLOW_INSECURE_ISSUER" \
          -e PUBLIC_URL="http://localhost:${PORT}" \
          -e WEBAPP_URL="http://localhost:${PORT}" \
          happy-server:ci

    - name: Wait for health
      run: |
        UP=0
        for i in $(seq 1 60); do
          if curl -sf -m 2 "http://127.0.0.1:${PORT}/health" -o /dev/null; then
            UP=1; echo "server healthy after ${i}s"; break
          fi
          # A no-op CMD exits immediately — fail fast and loudly rather than
          # waiting out the full timeout.
          if [ "$(docker inspect -f '{{.State.Running}}' happy-server-ci)" != "true" ]; then
            echo "Error: container exited before becoming healthy"
            echo "exit code: $(docker inspect -f '{{.State.ExitCode}}' happy-server-ci)"
            docker logs happy-server-ci
            exit 1
          fi
          sleep 1
        done
        if [ "$UP" != "1" ]; then
          echo "Error: server did not become healthy"
          docker logs happy-server-ci
          exit 1
        fi

    - name: Exercise endpoints
      run: |
        echo "--- /health"
        curl -sf -m 5 "http://127.0.0.1:${PORT}/health"; echo
        # Hits the database through Prisma, so this fails if the query engine
        # or the schema is not actually usable in the image.
        echo "--- /v1/auth/device/start"
        PK=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
        CODE=$(curl -s -m 5 -o /tmp/device-start.json -w '%{http_code}' \
          -H 'content-type: application/json' \
          -d "{\"ephemeralPublicKey\":\"$PK\",\"clientInfo\":{\"host\":\"ci\",\"os\":\"linux\",\"cliVersion\":\"0.0.0\"}}" \
          "http://127.0.0.1:${PORT}/v1/auth/device/start")
        cat /tmp/device-start.json; echo
        [ "$CODE" = "200" ] || { echo "Error: device/start returned HTTP $CODE"; exit 1; }
        grep -q '"userCode"' /tmp/device-start.json || { echo "Error: device/start returned no userCode"; exit 1; }

    - name: Container logs
      if: always()
      run: docker logs happy-server-ci || true

    - name: Stop container
      if: always()
      run: |
        docker rm -f happy-server-ci || true
        docker compose down -v || true

  # The standalone image is the self-host path: embedded PGlite, local files,
  # no external services other than the IdP.
  docker-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PORT: "3006"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build standalone image
      run: docker build -t happy-server-standalone:ci -f Dockerfile .

    - name: Start oidc-mock
      run: |
        docker compose up -d oidc-mock
        for i in $(seq 1 30); do
          curl -sf http://localhost:8180/.well-known/openid-configuration >/dev/null && exit 0
          sleep 1
        done
        docker compose logs oidc-mock
        exit 1

    # Host network so the issuer is http://localhost:8180 for the server too.
    - name: Start container
      run: |
        docker run -d --name happy-standalone-ci --network host \
          -e PORT="$PORT" \
          -e HANDY_MASTER_SECRET=ci-master-secret-not-used-in-production \
          -e OIDC_ISSUER=http://localhost:8180 \
          -e OIDC_CLIENT_ID=happy-server \
          -e OIDC_CLIENT_SECRET=happy-dev-secret \
          -e OIDC_ALLOW_INSECURE_ISSUER=true \
          -e PUBLIC_URL="http://localhost:${PORT}" \
          -e WEBAPP_URL="http://localhost:${PORT}" \
          happy-server-standalone:ci

    - name: Wait for health
      run: |
        UP=0
        for i in $(seq 1 90); do
          if curl -sf -m 2 "http://127.0.0.1:${PORT}/health" -o /dev/null; then
            UP=1; echo "standalone healthy after ${i}s"; break
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' happy-standalone-ci)" != "true" ]; then
            echo "Error: container exited before becoming healthy"
            echo "exit code: $(docker inspect -f '{{.State.ExitCode}}' happy-standalone-ci)"
            docker logs happy-standalone-ci
            exit 1
          fi
          sleep 1
        done
        if [ "$UP" != "1" ]; then
          echo "Error: standalone server did not become healthy"
          docker logs happy-standalone-ci
          exit 1
        fi

    - name: Container logs
      if: always()
      run: docker logs happy-standalone-ci || true

    - name: Stop container
      if: always()
      run: |
        docker rm -f happy-standalone-ci || true
        docker compose down -v || true
